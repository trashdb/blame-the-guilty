name: Swift Tests

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Build and Test (macOS)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          cd native
          xcodebuild build -scheme Statefalse -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-build | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run Tests
        run: |
          cd native
          xcodebuild test -scheme StatefalseTests -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-test \
            -resultBundlePath /tmp/statefalse-test.xcresult 2>&1 | tee /tmp/statefalse-test.log | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            /tmp/statefalse-test.log
            /tmp/statefalse-test.xcresult
