name: Swift Tests

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Build and Test (macOS)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          cd native
          xcodebuild build -scheme Statefalse -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-build | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run Tests
        run: |
          cd native
          xcodebuild test -scheme StatefalseTests -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-test \
            -resultBundlePath /tmp/statefalse-test.xcresult 2>&1 | tee /tmp/statefalse-test.log | xcpretty && exit ${PIPESTATUS[0]}

      - name: Surface test log in annotations
        if: failure()
        run: |
          rg -i -e "error" -e "failed" -e "crash" -e "signal" -e "killed" -e "xcodebuild:" /tmp/statefalse-test.log 2>/dev/null | tail -5 | sed 's/^/::error::/'
          tail -3 /tmp/statefalse-test.log 2>/dev/null | sed 's/^/::error::/'
